<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" viewBox="-20 -20 1040 1045" width="1040" height="1045">
  <!-- Campata tipo divisa per piani di profondità. Unità: larghezza modulo = 1000.
       data-sporgenza = sporgenza stimata davanti alla parete arretrata, stesse unità (vedi LEGGIMI.md). -->
  <g id="sfondo" inkscape:groupmode="layer" inkscape:label="sfondo"><rect x="-20" y="-20" width="1040" height="1045" fill="#000"/></g>
  <g id="apertura-telo" inkscape:groupmode="layer" inkscape:label="0 apertura telo (approssimata, piu arretrata)" data-sporgenza="negativa, non misurabile">
    <polygon points="179,55.0 821,55.0 821,365.0 179,365.0" fill="none" stroke="#6cf" stroke-width="3" stroke-dasharray="12 8"/></g>
  <g id="parete-arretrata" inkscape:groupmode="layer" inkscape:label="1 parete arretrata" data-sporgenza="0">
    <polygon points="166,0.0 834,0.0 834,876.0 166,876.0" fill="#ff4fc8"/></g>
  <g id="colonne" inkscape:groupmode="layer" inkscape:label="2 colonne" data-sporgenza="65 (da 50 a 90)">
    <polygon id="colonna-sx" points="0,0.0 166,0.0 166,876.0 0,876.0" fill="#35d08a"/>
    <polygon id="colonna-dx" points="834,0.0 1000,0.0 1000,876.0 834,876.0" fill="#35d08a"/></g>
  <g id="fascia-gialla" inkscape:groupmode="layer" inkscape:label="3 fascia gialla" data-sporgenza="110 (da 80 a 140)">
    <polygon points="0,876.0 1000,876.0 1000,987.5 952,1005.0 882,1005.0 767,963.0 233,963.0 118,1005.0 48,1005.0 0,987.5" fill="#f5be28"/></g>
</svg>
